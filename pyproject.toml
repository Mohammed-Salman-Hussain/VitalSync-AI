[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalsync-ai"
version = "1.0.0"
description = "A homogeneous, scientifically grounded, local-first health & lifestyle advisory intelligence platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "VitalSync AI Contributors" }
]
keywords = [
    "health",
    "wellness",
    "preventive-medicine",
    "machine-learning",
    "anti-cyberchondria",
    "local-ai",
    "ollama",
    "qwen",
    "fastapi",
    "streamlit",
    "public-health"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "kagglehub>=0.2.0"
]

[project.urls]
Homepage = "https://github.com/vitalsync-ai/vitalsync-ai"
Documentation = "https://github.com/vitalsync-ai/vitalsync-ai/tree/main/docs"
Repository = "https://github.com/vitalsync-ai/vitalsync-ai.git"
Issues = "https://github.com/vitalsync-ai/vitalsync-ai/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
